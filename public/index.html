<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADAM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #05070b;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 700px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(255,255,255,.08);
      position: relative;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff, #6d7cff 35%, #151a3a 70%);
      box-shadow:
        0 0 25px rgba(100,120,255,.45),
        inset 0 0 20px rgba(255,255,255,.3);
      animation: pulse 3s infinite ease-in-out;
    }

    @keyframes pulse {
      0%,100% {
        transform: scale(1);
        box-shadow: 0 0 20px rgba(100,120,255,.35);
      }
      50% {
        transform: scale(1.08);
        box-shadow: 0 0 38px rgba(100,120,255,.65);
      }
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px 18px 120px;
    }

    .welcome {
      text-align: center;
      margin-top: 18vh;
      opacity: .9;
    }

    .welcome h1 {
      font-size: 42px;
      margin: 0 0 10px;
      letter-spacing: -1px;
    }

    .welcome p {
      color: #9da3b5;
      font-size: 16px;
    }

    .message {
      margin: 14px 0;
      padding: 14px 16px;
      border-radius: 18px;
      max-width: 88%;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      background: #26304f;
    }

    .adam {
      margin-right: auto;
      background: #111621;
      border: 1px solid rgba(255,255,255,.07);
    }

    .composer {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(700px, 100%);
      padding: 12px 14px 20px;
      background: linear-gradient(
        to top,
        #05070b 70%,
        rgba(5,7,11,0)
      );
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #111621;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      padding: 7px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 16px;
      padding: 10px 12px;
      max-height: 120px;
      font-family: inherit;
    }

    textarea::placeholder {
      color: #73798b;
    }

    button {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: #6675ff;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
    }
  </style>
</head>

<body>

  <main class="app">

    <header>
      <div class="logo"></div>
    </header>

    <section id="messages" class="messages">

      <div class="welcome" id="welcome">
        <h1>ADAM</h1>
        <p>Tu asistente inteligente</p>
      </div>

    </section>

    <div class="composer">

      <div class="input-box">

        <textarea
          id="input"
          rows="1"
          placeholder="Habla con ADAM..."
        ></textarea>

        <button id="send">↑</button>

      </div>

    </div>

  </main>

  <script>
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");

    function addMessage(text, type) {
      if (welcome) {
        welcome.style.display = "none";
      }

      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();

      if (!text) return;

      addMessage(text, "user");

      input.value = "";
      send.disabled = true;

      try {

        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text
          })
        });

        const data = await response.json();

        if (data.reply) {
          addMessage(data.reply, "adam");
        } else {
          addMessage(
            "ADAM está conectado, pero todavía estamos configurando mi cerebro.",
            "adam"
          );
        }

      } catch (error) {

        addMessage(
          "Todavía estoy configurando mi conexión con el cerebro de IA.",
          "adam"
        );

      }

      send.disabled = false;
      input.focus();
    }

    send.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

  </script>

</body>
</html>
