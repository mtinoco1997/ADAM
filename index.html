<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADAM</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070b;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:700px;
  height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  background:
    radial-gradient(circle at 50% 38%,rgba(40,90,140,.18),transparent 32%),
    #05070b;
}

.header{
  height:75px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid rgba(255,255,255,.08);
  position:relative;
  z-index:5;
}

.header h1{
  margin:0;
  font-size:22px;
  font-weight:600;
  letter-spacing:4px;
}

.status{
  position:absolute;
  right:20px;
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  color:#8d99a8;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#42d392;
  box-shadow:0 0 12px #42d392;
}

.brain-area{
  flex:1;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.wave{
  position:absolute;
  width:330px;
  height:330px;
  border:1px solid rgba(90,170,255,.12);
  border-radius:50%;
  animation:pulse 4s infinite ease-in-out;
}

.wave:nth-child(2){
  width:430px;
  height:430px;
  animation-delay:1s;
}

.wave:nth-child(3){
  width:540px;
  height:540px;
  animation-delay:2s;
}

@keyframes pulse{
  0%,100%{
    transform:scale(.88);
    opacity:.15;
  }
  50%{
    transform:scale(1.08);
    opacity:.5;
  }
}

.core{
  width:135px;
  height:135px;
  border-radius:50%;
  background:
    radial-gradient(
      circle at 35% 30%,
      #ffffff 0%,
      #8fd0ff 8%,
      #367dff 28%,
      #12295e 58%,
      #05070b 76%
    );
  box-shadow:
    0 0 25px rgba(70,150,255,.8),
    0 0 80px rgba(50,120,255,.35),
    inset 0 0 30px rgba(255,255,255,.25);
  animation:corePulse 3s infinite ease-in-out;
  position:relative;
  z-index:2;
}

.core:before,
.core:after{
  content:"";
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(150,210,255,.35);
}

.core:before{
  inset:-14px;
  animation:spin 8s linear infinite;
}

.core:after{
  inset:-27px;
  border-color:rgba(100,170,255,.12);
  animation:spin 12s linear infinite reverse;
}

@keyframes corePulse{
  0%,100%{transform:scale(.96);}
  50%{transform:scale(1.04);}
}

@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

.messages{
  position:absolute;
  left:18px;
  right:18px;
  bottom:25px;
  max-height:30%;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
  z-index:4;
}

.message{
  max-width:85%;
  padding:10px 14px;
  border-radius:16px;
  font-size:14px;
  line-height:1.4;
  backdrop-filter:blur(15px);
}

.adam{
  align-self:flex-start;
  background:rgba(30,40,55,.75);
  border:1px solid rgba(100,150,210,.15);
}

.user{
  align-self:flex-end;
  background:rgba(40,100,180,.5);
}

.input-area{
  padding:12px 14px 22px;
  display:flex;
  gap:9px;
  border-top:1px solid rgba(255,255,255,.08);
  background:rgba(5,7,11,.9);
  backdrop-filter:blur(20px);
}

.input{
  flex:1;
  height:48px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:25px;
  outline:none;
  background:#11161e;
  color:white;
  padding:0 18px;
  font-size:16px;
}

.input::placeholder{
  color:#687382;
}

.send{
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:#287cff;
  color:white;
  font-size:20px;
  cursor:pointer;
  box-shadow:0 0 18px rgba(40,124,255,.35);
}

.send:active{
  transform:scale(.92);
}

.hidden{
  display:none!important;
}
</style>
</head>

<body>

<div class="app" id="app">

  <div class="header">
    <h1>ADAM</h1>

    <div class="status">
      <span class="dot"></span>
      <span id="statusText">ACTIVO</span>
    </div>
  </div>

  <main class="brain-area">

    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>

    <div class="core"></div>

    <div class="messages" id="messages">
      <div class="message adam">
        Hola. Soy ADAM. Estoy listo.
      </div>
    </div>

  </main>

  <div class="input-area">

    <input
      id="input"
      class="input"
      autocomplete="off"
      placeholder="Habla con ADAM..."
    >

    <button class="send" id="send">↑</button>

  </div>

</div>

<script>
const input = document.getElementById("input");
const send = document.getElementById("send");
const messages = document.getElementById("messages");
const app = document.getElementById("app");

let memory = JSON.parse(
  localStorage.getItem("adam_memory") || "{}"
);

function saveMemory(){
  localStorage.setItem(
    "adam_memory",
    JSON.stringify(memory)
  );
}

function addMessage(text,type){
  const div = document.createElement("div");

  div.className = "message " + type;
  div.textContent = text;

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function localCommand(text){

  const command = text.toLowerCase().trim();

  if(command === "ocultar" || command === "hide"){
    app.classList.add("hidden");
    return true;
  }

  if(command === "mostrar" || command === "show"){
    app.classList.remove("hidden");
    return true;
  }

  if(command === "olvida todo" || command === "olvida"){
    memory = {};
    saveMemory();

    addMessage(
      "He borrado la memoria local.",
      "adam"
    );

    return true;
  }

  if(command === "memoria"){

    const keys = Object.keys(memory);

    if(keys.length === 0){
      addMessage(
        "Mi memoria local está vacía.",
        "adam"
      );
    }else{
      addMessage(
        "Tengo guardado: " + keys.join(", "),
        "adam"
      );
    }

    return true;
  }

  if(command === "hora"){

    addMessage(
      "Son las " +
      new Date().toLocaleTimeString("es-ES",{
        hour:"2-digit",
        minute:"2-digit"
      }),
      "adam"
    );

    return true;
  }

  if(command === "fecha" || command === "día"){

    addMessage(
      new Date().toLocaleDateString("es-ES",{
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"
      }),
      "adam"
    );

    return true;
  }

  return false;
}

async function sendMessage(){

  const text = input.value.trim();

  if(!text) return;

  addMessage(text,"user");

  input.value = "";

  if(localCommand(text)){
    return;
  }

  addMessage(
    "Estoy procesando tu mensaje...",
    "adam"
  );

  /*
    IMPORTANTE:

    La inteligencia de ADAM se conectará
    mediante un servidor seguro.

    NO pongas una API key aquí.

    El servidor recibirá:

    POST /api/chat

    {
      "message": "texto del usuario",
      "memory": {...}
    }
  */

  try{

    const response = await fetch(
      ""https://luuyfotrhbnstqdikasi.supabase.co/functions/v1/adam-chat"",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          message:text,
          memory:memory
        })
      }
    );

    if(!response.ok){
      throw new Error(
        "Servidor no disponible"
      );
    }

    const data = await response.json();

    const last =
      messages.lastElementChild;

    if(last){
      last.textContent =
        data.reply ||
        "No he recibido respuesta.";
    }

    if(data.memory){
      memory = data.memory;
      saveMemory();
    }

  }catch(error){

    const last =
      messages.lastElementChild;

    if(last){
      last.textContent =
        "ADAM está conectado a la interfaz, pero todavía falta configurar el servidor de inteligencia.";
    }
  }
}

send.addEventListener(
  "click",
  sendMessage
);

input.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      sendMessage();
    }
  }
);

window.addEventListener(
  "load",
  function(){
    input.focus();
  }
);
</script>

</body>
</html>
